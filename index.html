<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="尤的工作台">
<meta name="theme-color" content="#831843">
<title>尤的工作台</title>
<style>
:root{
  --bg:#fdf5f8; --card:#fff; --border:#f0dce4; --text:#3d2431;
  --text-muted:#9b6b7e; --primary:#ec4899; --primary-dark:#db2777;
  --primary-light:#fce7f3; --success:#10b981; --danger:#ef4444;
  --warning:#f59e0b; --sidebar:#831843; --sidebar-hover:#9d174d;
  --sidebar-active:#ec4899;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;margin:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px}
.app{display:flex;height:100dvh;overflow:hidden;box-sizing:border-box}

.sidebar{width:230px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s}
.sidebar-header{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-header .logo{width:28px;height:28px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-header p{font-size:11px;color:#94a3b8;margin-top:6px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;padding:8px 12px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:15px;color:#cbd5e1;transition:background .15s,color .15s;user-select:none}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-item .nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-sub{padding-left:42px;font-size:13px;color:#94a3b8}
.account-sub.active{background:var(--sidebar-active);color:#fff}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#64748b;display:flex;justify-content:space-between;align-items:center;gap:8px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{min-height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top,0px);flex-shrink:0;gap:8px;box-sizing:border-box;position:sticky;top:0}
.topbar h2{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:15px;cursor:pointer;font-weight:500;transition:all .15s;background:transparent;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover,.btn-primary:active{background:var(--primary-dark)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover,.btn-ghost:active{background:var(--bg);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:14px}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-success{background:var(--success);color:#fff}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title .left{display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700;letter-spacing:-.5px;word-break:break-all}
.stat-card .sub{font-size:11px;margin-top:4px;color:var(--text-muted)}
.stat-card .icon{position:absolute;right:12px;top:12px;font-size:20px;opacity:.15}
.stat-card.positive .value{color:var(--success)}
.stat-card.negative .value{color:var(--danger)}

.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid transparent;transition:border-color .15s}
.task-item:hover{border-color:var(--border)}
.task-item.done{opacity:.55}
.task-item.done .task-title{text-decoration:line-through;color:var(--text-muted)}
.task-checkbox{width:20px;height:20px;border:2px solid var(--text-muted);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
.task-checkbox:hover{border-color:var(--primary)}
.task-checkbox.checked{background:var(--success);border-color:var(--success);color:#fff}
.task-checkbox.checked::after{content:"✓";font-size:12px;font-weight:700}
.task-content{flex:1;min-width:0}
.task-title{font-size:16px;font-weight:500;word-break:break-word}
.task-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--primary-light);color:var(--primary)}
.priority-high{color:var(--danger)}
.priority-mid{color:var(--warning)}
.priority-low{color:var(--text-muted)}
.task-del{opacity:0;color:var(--danger);cursor:pointer;font-size:14px;transition:opacity .15s;flex-shrink:0;padding:4px}
.task-item:hover .task-del,.task-item:active .task-del{opacity:1}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:20px;font-size:14px;cursor:pointer;background:var(--bg);color:var(--text-muted);border:1px solid var(--border);transition:all .15s;user-select:none}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.input,.select{padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:16px;outline:none;background:#fff;color:var(--text);font-family:inherit;width:100%}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.form-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block;font-weight:500}

.table-wrap{display:none;overflow-x:auto}
.table-wrap table{width:100%;border-collapse:collapse;font-size:15px}
.table-wrap th{text-align:left;padding:10px 8px;color:var(--text-muted);font-weight:500;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
.table-wrap td{padding:10px 8px;border-bottom:1px solid var(--border)}
.table-wrap tr:hover td{background:var(--bg)}

.card-list{display:none;flex-direction:column;gap:10px}
.rec-card{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rec-card .rec-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rec-card .rec-label{font-size:11px;color:var(--text-muted)}
.rec-card .rec-val{font-size:13px;font-weight:500;word-break:break-word;text-align:right}
.rec-card .rec-main{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.rec-card .rec-name{font-size:14px;font-weight:600;word-break:break-word;flex:1}
.rec-card .rec-amount{font-size:16px;font-weight:700;white-space:nowrap}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-income{background:#e6fffa;color:#065f46}
.badge-expense{background:#fff5f5;color:#9b2c2c}
.badge-debt{background:#fffaf0;color:#9c4221}

.progress-bar{width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

.empty{text-align:center;padding:40px 16px;color:var(--text-muted);font-size:13px}
.empty .emoji{font-size:32px;margin-bottom:8px;opacity:.4}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:20px;width:440px;max-width:100%;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:2000;animation:toastIn .25s;max-width:90vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* AI助手 */
.ai-fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;font-size:24px;cursor:pointer;z-index:1500;box-shadow:0 4px 16px rgba(236,72,153,0.4);transition:transform .2s}
.ai-fab:active{transform:scale(0.9)}
.ai-panel{position:fixed;bottom:0;left:0;right:0;height:75vh;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,0.15);z-index:1600;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s;padding-bottom:env(safe-area-inset-bottom,0px)}
.ai-panel.open{transform:translateY(0)}
.ai-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.ai-header h3{font-size:16px;display:flex;align-items:center;gap:8px}
.ai-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-muted);padding:4px 8px}
.ai-chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.ai-msg{display:flex;max-width:85%}
.ai-msg-user{align-self:flex-end}
.ai-msg-bot{align-self:flex-start}
.ai-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
.ai-bubble-user{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-bubble-bot{background:var(--primary-light);color:var(--text);border-bottom-left-radius:4px}
.ai-typing span{display:inline-block;animation:typing 1.4s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ai-input-area{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.ai-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;resize:none;max-height:80px;min-height:40px;font-family:inherit;line-height:1.5}
.ai-input:focus{outline:none;border-color:var(--primary)}
.ai-send{width:40px;height:40px;border-radius:8px;background:var(--primary);color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ai-send:disabled{opacity:.5}

.finance-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.finance-card{padding:14px;border-radius:10px;color:#fff}
.finance-card.assets{background:linear-gradient(135deg,#ec4899,#db2777)}
.finance-card.debts{background:linear-gradient(135deg,#f43f5e,#e11d48)}
.finance-card.net{background:linear-gradient(135deg,#10b981,#059669)}
.finance-card .label{font-size:11px;opacity:.85;margin-bottom:4px}
.finance-card .value{font-size:22px;font-weight:700;word-break:break-all}

.todo-group{margin-bottom:18px}
.todo-group-title{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.todo-count{font-size:11px;background:var(--card);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,0px);z-index:100;justify-content:space-around;align-items:center;box-sizing:border-box}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;cursor:pointer;color:var(--text-muted);font-size:11px;transition:color .15s;user-select:none}
.bn-item .bn-icon{font-size:24px}
.bn-item.active{color:var(--primary);font-weight:600}

/* === 爆款灵感卡片 === */
.insight-card{background:linear-gradient(135deg,#fff 0%,#f8f9ff 100%);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:all .15s;cursor:default}
.insight-card:hover{box-shadow:0 2px 8px rgba(79,110,247,.1);border-color:var(--primary-light)}
.insight-card-match{border-color:#9ae6b4;background:linear-gradient(135deg,#f0fff4 0%,#fff 100%)}
.insight-card-match:hover{box-shadow:0 2px 8px rgba(56,161,105,.15);border-color:#68d391}

/* === 选题脚本区 === */
.script-stat{flex:1;min-width:90px;background:var(--bg);border-radius:8px;padding:10px 12px;text-align:center}
.script-stat-num{font-size:20px;font-weight:700}
.script-stat-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.script-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.script-item.script-done{opacity:.6}
.script-item.script-done .script-item-title{text-decoration:line-through}
.script-item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.script-item-title{font-size:17px;font-weight:600;word-break:break-word;flex:1;min-width:0}
.script-item-idea{font-size:14px;color:var(--text-muted);background:#fffbeb;padding:8px 12px;border-radius:6px;margin-bottom:8px;line-height:1.6;word-break:break-word}
.script-item-preview{font-size:15px;color:var(--text);line-height:1.7;margin-bottom:8px;word-break:break-word}
.script-item-meta{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.script-item-actions{display:flex;gap:6px;flex-wrap:wrap}
.insight-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.insight-rank{background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;min-width:24px;text-align:center}
.insight-platform{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:500}
.insight-platform.dy{background:#000;color:#fff}
.insight-platform.xhs{background:#ff2442;color:#fff}
.insight-platform.wb{background:#e6162d;color:#fff}
.insight-platform.zhihu{background:#0084ff;color:#fff}
.insight-platform.baidu{background:#2932e1;color:#fff}
.insight-platform.toutiao{background:#ff0000;color:#fff}
.insight-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;word-break:break-word}
.insight-hot{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.insight-hot .fire{color:var(--danger)}
.insight-actions{display:flex;gap:6px;margin-top:10px}
.insight-btn{padding:4px 10px;font-size:11px;border-radius:5px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text-muted);transition:all .15s}
.insight-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.insight-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}

.insight-source-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.insight-source-tab{padding:4px 10px;font-size:12px;border-radius:6px;background:var(--bg);color:var(--text-muted);border:1px solid var(--border);cursor:pointer;user-select:none}
.insight-source-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.refresh-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.refresh-bar .last-update{font-size:11px;color:var(--text-muted)}
.loading-dots{display:inline-flex;gap:3px}
.loading-dots span{width:5px;height:5px;background:var(--primary);border-radius:50%;animation:bounce .6s infinite alternate}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-3px)}}

@media(max-width:768px){
  .app{flex-direction:column;padding-bottom:0}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:200;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
  .sidebar-overlay.show{display:block}
  .main{width:100%;flex:1}
  .content{padding:12px 12px calc(68px + env(safe-area-inset-bottom,0px))}
  .bottom-nav{display:flex}
  .table-wrap{display:none!important}
  .card-list{display:flex!important}
  .finance-summary{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card .value{font-size:20px}
  .stat-card .sub{font-size:10px}
  .topbar{padding:0 12px;padding-top:env(safe-area-inset-top,0px)}
  .topbar h2{font-size:15px}
  .menu-btn{display:flex!important}
  .btn-sm{padding:6px 12px;font-size:14px}
  .modal{border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%;max-height:80vh}
  .modal-overlay{align-items:flex-end;padding:0}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media(min-width:769px){
  .table-wrap{display:block}
  .card-list{display:none}
  .menu-btn{display:none!important}
}
.menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text);align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="logo">🚀</span> <span>尤的工作台</span></h1>
      <p>个人运营管理中枢</p>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <span id="todayDate"></span>
      <span id="taskCount">0 待办</span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
        <h2 id="pageTitle">工作台</h2>
      </div>
      <div class="actions" id="pageActions">
        <button class="btn-sm" onclick="forceSync()" title="同步数据" style="background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);font-size:14px;padding:6px 12px;border-radius:8px;white-space:nowrap">🔄 同步</button>
        <span style="font-size:11px;color:var(--text-muted)">v4.4</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<button class="ai-fab" onclick="toggleAI()" title="AI助手">🤖</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-header">
    <h3>🤖 AI创作助手</h3>
    <button class="ai-close" onclick="toggleAI()">×</button>
  </div>
  <div class="ai-chat" id="aiChat"></div>
  <div class="ai-input-area">

<script>
// ============ 数据层（Supabase 云端） ============
const SUPA_URL = 'https://syhnjmqhsxmmpfcuqpea.supabase.co';
const SUPA_KEY = 'sb_publishable_OecGX-l8eCbVgDm4hMkbiA_cOwC1aoN';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// 表名映射
const TABLE_MAP = {
  tasks: 'tasks', todos: 'todos', assets: 'assets',
  debts: 'debts', records: 'records', scripts: 'scripts', stats: 'video_stats'
};

// 各表排序字段（有的表没有created字段，用id排序）
const SORT_MAP = {
  tasks: 'created', todos: 'created', assets: 'id',
  debts: 'id', records: 'date', scripts: 'created', stats: 'created'
};

// 字段名转换（驼峰 ↔ 下划线）
const FIELD_MAP = {
  tasks: {dueDate:'due_date'},
  todos: {},
  assets: {},
  debts: {},
  records: {},
  scripts: {}
};

// 本地缓存（用于快速渲染，云端为准）
const CACHE = {};

const DB = {
  // 同步状态：0=空闲 1=进行中
  _syncing: false,
  // 从云端拉取数据到缓存（用REST API）
  async sync(key){
    const table = TABLE_MAP[key];
    if(!table) return [];
    const sortCol = SORT_MAP[key] || 'id';
    try{
      const resp = await fetch(`${SUPA_URL}/rest/v1/${table}?select=*&order=${sortCol}.desc`, {
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`
        }
      });
      if(!resp.ok){
        console.error('sync error:', key, resp.status);
        return CACHE[key]||[];
      }
      const data = await resp.json();
      CACHE[key] = (data || []).map(row=>fromRow(key, row));
      return CACHE[key];
    }catch(e){ console.error(e); return CACHE[key]||[]; }
  },
  // 读取缓存数据（同步，用于渲染）
  get(key, def=[]){
    return CACHE[key] || def;
  },
  // 新增一条记录（用REST API，避免SDK兼容性问题）
  async insert(key, item){
    const table = TABLE_MAP[key];
    if(!table) return;
    const row = toRow(key, item);
    try{
      const resp = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(row)
      });
      if(!resp.ok && resp.status !== 201){
        console.error('insert error:', key, resp.status);
        toast('⚠️ 保存失败，请检查网络');
        return false;
      }
      CACHE[key] = CACHE[key] || [];
      CACHE[key].unshift(item);
      return true;
    }catch(e){ console.error('insert error:', e); toast('⚠️ 保存失败，请检查网络'); return false; }
  },
  // 更新一条记录（用REST API）
  async update(key, id, patch){
    const table = TABLE_MAP[key];
    if(!table) return;
    const rowPatch = toRow(key, patch, true);
    try{
      const resp = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(rowPatch)
      });
      if(!resp.ok && resp.status !== 204){
        console.error('update error:', key, resp.status);
        toast('⚠️ 更新失败');
        return false;
      }
      if(CACHE[key]){
        const idx = CACHE[key].findIndex(x=>x.id===id);
        if(idx>=0) Object.assign(CACHE[key][idx], patch);
      }
      return true;
    }catch(e){ console.error('update error:', e); toast('⚠️ 更新失败'); return false; }
  },
  // 删除一条记录（直接用REST API，避免SDK兼容性问题）
  async remove(key, id){
    const table = TABLE_MAP[key];
    if(!table) return;
    try{
      const resp = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json'
        }
      });
      if(!resp.ok && resp.status !== 204){
        console.error('remove error:', key, resp.status);
        toast('⚠️ 删除失败');
        return false;
      }
      if(CACHE[key]) CACHE[key] = CACHE[key].filter(x=>x.id!==id);
      return true;
    }catch(e){ console.error('remove error:', e); toast('⚠️ 删除失败'); return false; }
  },
  // 替换整个列表（用于初始化）
  async replaceAll(key, items){
    const table = TABLE_MAP[key];
    if(!table) return;
    try{
      await supa.from(table).delete().neq('id','___none___');
      if(items.length){
        const rows = items.map(i=>toRow(key, i));
        await supa.from(table).insert(rows);
      }
      CACHE[key] = items;
    }catch(e){ console.error('replaceAll error:', e); }
  }
};

// 转换数据库行为前端对象
function fromRow(key, row){
  if(key==='tasks'){
    return {id:row.id, account:row.account, title:row.title, dueDate:row.due_date, priority:row.priority, tags:row.tags, done:row.done, created:row.created};
  } else if(key==='todos'){

    return {id:row.id, type:row.type, date:row.date, amount:row.amount, category:row.category, note:row.note};
  } else if(key==='scripts'){
    return {id:row.id, account:row.account, title:row.title, idea:row.idea, script:row.script, done:row.done, created:row.created, updated:row.updated};

// ============ 选题与脚本模块 ============
function renderScriptSection(acc){
  const scripts = DB.get('scripts').filter(s=>s.account===acc.id);
  const ideas = scripts.filter(s=>!s.script);       // 仅选题，未写脚本
  const drafted = scripts.filter(s=>s.script && !s.done); // 已写脚本未完成
  const finished = scripts.filter(s=>s.done);        // 已完成

  return `
    <div class="card">
      <div class="card-title">
        <span class="left"><span class="dot" style="background:${acc.color}"></span>💡 选题灵感 & 脚本</span>
        <button class="btn btn-primary btn-sm" onclick="openIdeaModal('${acc.id}')">+ 记选题</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <div class="script-stat" style="border-top:3px solid var(--warning)">
          <div class="script-stat-num">${ideas.length}</div>
          <div class="script-stat-label">待写脚本</div>
        </div>
        <div class="script-stat" style="border-top:3px solid var(--primary)">
          <div class="script-stat-num">${drafted.length}</div>
          <div class="script-stat-label">脚本草稿</div>
        </div>
        <div class="script-stat" style="border-top:3px solid var(--success)">
          <div class="script-stat-num">${finished.length}</div>
          <div class="script-stat-label">已完成</div>
        </div>
      </div>

      <div id="scriptsList">
        ${renderScriptItems(acc.id, scripts)}
      </div>
    </div>
  `;
}

function renderScriptItems(accId, scripts){
  if(!scripts.length){
    return '<div class="empty"><div class="emoji">💡</div>还没有选题，随时想到随时点「+ 记选题」记录下来</div>';
  }
  // 按时间倒序
  const list = [...scripts].sort((a,b)=>(b.created||0)-(a.created||0));
  return list.map(s=>{
    const statusBadge = s.done
      ? '<span class="badge" style="background:#c6f6d5;color:#22543d">✅ 已完成</span>'
      : s.script
      ? '<span class="badge" style="background:var(--primary-light);color:var(--primary)">📝 脚本草稿</span>'
      : '<span class="badge" style="background:#feebc8;color:#7b341e">💡 待写脚本</span>';
    const previewText = s.script ? esc(s.script).replace(/\n/g,' ') : '<span style="color:var(--text-muted)">还没写脚本，点「写脚本」开始创作</span>';
    const preview = previewText.length > 120 ? previewText.slice(0,120)+'…' : previewText;
    return `
      <div class="script-item ${s.done?'script-done':''}">
        <div class="script-item-header">
          <div class="script-item-title">${esc(s.title)}</div>
          ${statusBadge}
        </div>
        ${s.idea ? `<div class="script-item-idea">💭 ${esc(s.idea)}</div>` : ''}
        <div class="script-item-preview">${preview}</div>
        <div class="script-item-meta">
          ${s.created?new Date(s.created).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):''}
          ${s.updated?` · 编辑于 ${new Date(s.updated).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-')}`:''}
        </div>
        <div class="script-item-actions">
          <button class="insight-btn primary" onclick="openScriptEditor('${accId}','${s.id}')">${s.script?'✏️ 编辑脚本':'✍️ 写脚本'}</button>
          <button class="insight-btn" onclick="toggleScriptDone('${s.id}')">${s.done?'↩️ 取消完成':'✅ 标记完成'}</button>
          <button class="insight-btn" onclick="scriptToTask('${accId}','${s.id}')">📋 转任务</button>
          <button class="insight-btn" onclick="delScript('${s.id}')" style="color:var(--danger)">🗑 删除</button>
        </div>
      </div>
    `;
  }).join('');
}

// 记录选题（标题+灵感）
function openIdeaModal(accId){
  modalForm('记录选题灵感',[
    {key:'title',label:'选题标题',placeholder:'例如：熬夜党必备的3款养生茶',required:true},
    {key:'idea',label:'灵感/思路',type:'textarea',placeholder:'为什么选这个话题？切入点是什么？想表达什么观点？目标人群是谁？随便写，想到什么写什么…'},
  ],(data)=>{
    const item={id:uid(),account:accId,title:data.title,idea:data.idea,script:'',done:false,created:Date.now(),updated:0};

// 脚本编辑器（全屏弹窗，支持大段文字）
function openScriptEditor(accId, scriptId){
  const list = DB.get('scripts');
  const s = list.find(x=>x.id===scriptId);
  if(!s) return;
  const m=document.createElement('div');
  m.className='modal-overlay';
  m.innerHTML=`
    <div class="modal" style="width:680px;max-width:100%;max-height:90vh;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">选题标题</div>
          <input class="input" id="se_title" value="${esc(s.title).replace(/"/g,'&quot;')}" style="font-size:16px;font-weight:600">
        </div>
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()" style="flex-shrink:0">✕</button>
      </div>
      ${s.idea?`<div style="font-size:12px;color:var(--text-muted);background:var(--bg);padding:8px 12px;border-radius:6px;margin-bottom:12px"><b>💭 灵感：</b>${esc(s.idea)}</div>`:''}
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">脚本正文 <span style="color:var(--text-muted)">（支持换行，随时自动保存草稿）</span></div>
      <textarea id="se_script" class="input" style="flex:1;min-height:300px;resize:vertical;line-height:1.7;font-size:14px" placeholder="在这里写你的口播脚本/视频文案…

开头钩子：
正文要点：
1.
2.
3.
结尾引导：">${esc(s.script||'')}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap">
        <div style="font-size:11px;color:var(--text-muted)" id="se_status">未保存</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">关闭</button>
          <button class="btn btn-primary" id="se_save">💾 保存</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(m);
  const ta = m.querySelector('#se_script');
  const statusEl = m.querySelector('#se_status');
  
  // 自动保存草稿（输入停顿1秒后）
  let saveTimer = null;
  ta.addEventListener('input',()=>{
    statusEl.textContent='编辑中…';
    statusEl.style.color='var(--warning)';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      saveScriptDraft(scriptId, m.querySelector('#se_title').value, ta.value);
      statusEl.textContent='已自动保存 ✓';
      statusEl.style.color='var(--success)';
    }, 1000);
  });
  
  m.querySelector('#se_save').onclick=()=>{
    saveScriptDraft(scriptId, m.querySelector('#se_title').value, ta.value);
    toast('脚本已保存 ✓');
    m.remove();
    renderContent();
  };
  m.addEventListener('click',e=>{if(e.target===m){saveScriptDraft(scriptId,m.querySelector('#se_title').value,ta.value);m.remove();renderContent();}});
}

function saveScriptDraft(scriptId, title, script){
  const list = DB.get('scripts');
  const s = list.find(x=>x.id===scriptId);
  if(s){
    s.title = title;
    s.script = script;
    s.updated = Date.now();
    DB.update('scripts', scriptId, {title:title, script:script, updated:s.updated});
  }
}

function toggleScriptDone(id){
  const list = DB.get('scripts');
  const s = list.find(x=>x.id===id);
  if(s){s.done=!s.done;s.updated=Date.now();DB.update('scripts',id,{done:s.done,updated:s.updated}).then(ok=>{ if(ok){ toast(s.done?'已标记完成 ✓':'已取消完成'); renderContent(); } });}
}

function scriptToTask(accId, id){
  const s = DB.get('scripts').find(x=>x.id===id);
  if(!s) return;
  const item={id:uid(),account:accId,title:'【脚本】'+s.title,dueDate:new Date().toISOString().slice(0,10),priority:'mid',tags:'脚本',done:false,created:Date.now()};
  DB.insert('tasks',item).then(ok=>{
    if(!ok) return;
    // 转任务成功后，从选题列表移除该选题
    DB.remove('scripts',id).then(()=>{
      toast('已转为任务，已跳转到任务清单 ✓');
      renderContent();
      // 滚动到任务清单
      setTimeout(()=>{
        const tl = document.getElementById('taskList');
        if(tl){ tl.scrollIntoView({behavior:'smooth',block:'center'}); }
      },100);
    });
  });
}

function delScript(id){
  if(!confirm('确认删除这个选题和脚本？删除后不可恢复。'))return;
  DB.remove('scripts',id).then(ok=>{ if(ok){ toast('已删除'); renderContent(); } });
}

// ============ 任务操作 ============
function renderTaskItems(tasks, accId){
  const filter = window['_accFilter_'+accId]||'all';
  let list = tasks;
  if(filter==='todo') list = tasks.filter(t=>!t.done);
  if(filter==='done') list = tasks.filter(t=>t.done);
  if(!list.length) return '<div class="empty"><div class="emoji">📋</div>暂无任务</div>';
  return list.map(t=>`
    <div class="task-item ${t.done?'done':''}">
      <div class="task-checkbox ${t.done?'checked':''}" onclick="toggleTask('${t.id}')"></div>
      <div class="task-content" onclick="editTask('${t.id}')" style="cursor:pointer">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          ${t.dueDate?`📅 ${t.dueDate}`:''}
          ${t.priority?` · <span class="priority-${t.priority}">${{high:'紧急',mid:'重要',low:'常规'}[t.priority]}</span>`:''}
          ${t.tags?` · <span class="task-tag">${esc(t.tags)}</span>`:''}
        </div>
      </div>
      <span class="task-edit" onclick="editTask('${t.id}')" style="cursor:pointer;margin-right:6px;font-size:13px;color:var(--primary)">编辑</span>
      <span class="task-del" onclick="delTask('${t.id}')" style="cursor:pointer;font-size:13px">删除</span>
    </div>
  `).join('');
}

function setAccFilter(accId, f){
  window['_accFilter_'+accId]=f;
  const tasks = DB.get('tasks').filter(t=>t.account===accId);
  document.getElementById('taskList').innerHTML = renderTaskItems(tasks, accId);
}

function openTaskModal(accId){
  modalForm('添加任务',[
    {key:'title',label:'任务标题',placeholder:'例如：拍摄养生茶测评视频',required:true},
    {key:'dueDate',label:'截止日期',type:'date'},
    {key:'priority',label:'优先级',type:'select',options:[['low','常规'],['mid','重要'],['high','紧急']],value:'mid'},
    {key:'tags',label:'标签',placeholder:'选题/拍摄/剪辑/发布...'},
  ],(data)=>{
    const item = {id:uid(),account:accId,...data,done:false,created:Date.now()};
    DB.insert('tasks', item).then(ok=>{
      if(ok){ toast('任务已添加 ✓'); renderContent();renderSidebar();renderBottomNav(); }
    });
  });
}

function toggleTask(id){
  const tasks = DB.get('tasks');
  const t = tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;DB.update('tasks',id,{done:t.done}).then(ok=>{ if(ok){ renderContent();renderSidebar();renderBottomNav(); } });}
}
function delTask(id){
  if(!confirm('确认删除此任务？'))return;
  DB.remove('tasks',id).then(ok=>{ if(ok){ renderContent();renderSidebar();renderBottomNav(); } });
}
function editTask(id){
  const t=DB.get('tasks').find(x=>x.id===id);if(!t)return;
  modalForm('编辑任务',[
    {key:'title',label:'任务标题',placeholder:'例如：拍摄养生茶测评视频',required:true,value:t.title},
    {key:'dueDate',label:'截止日期',type:'date',value:t.dueDate||''},
    {key:'priority',label:'优先级',type:'select',options:[['low','常规'],['mid','重要'],['high','紧急']],value:t.priority||'mid'},
    {key:'tags',label:'标签',placeholder:'选题/拍摄/剪辑/发布...',value:t.tags||''},
  ],(data)=>{DB.update('tasks',id,data).then(ok=>{ if(ok){ toast('已更新 ✓'); renderContent();renderSidebar();renderBottomNav(); } });});
}

// ============ 资金管理 ============
function renderFinance(){
  const assets = DB.get('assets');
  const debts = DB.get('debts');
  const records = DB.get('records');
  const totalAsset = assets.reduce((s,a)=>s+(+a.amount||0),0);
  const totalDebt = debts.reduce((s,d)=>s+(+d.amount||0),0);
  const netWorth = totalAsset - totalDebt;
  const todayISO = new Date().toISOString().slice(0,7);
  const monthRecords = records.filter(r=>r.date && r.date.slice(0,7)===todayISO);
  const income = monthRecords.filter(r=>r.type==='income').reduce((s,r)=>s+(+r.amount||0),0);
  const expense = monthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+(+r.amount||0),0);

  document.getElementById('pageActions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="openAssetModal()">+ 资产</button>
    <button class="btn btn-danger btn-sm" onclick="openDebtModal()">+ 负债</button>
    <button class="btn btn-primary btn-sm" onclick="openRecordModal()">+ 收支</button>
  `;

  document.getElementById('content').innerHTML = `
    <div class="finance-summary">
      <div class="finance-card assets"><div class="label">💰 总资产</div><div class="value">¥${fmt(totalAsset)}</div><div style="font-size:11px;opacity:.8;margin-top:4px">${assets.length} 项</div></div>
      <div class="finance-card debts"><div class="label">📉 总负债</div><div class="value">¥${fmt(totalDebt)}</div><div style="font-size:11px;opacity:.8;margin-top:4px">${debts.length} 项</div></div>
      <div class="finance-card net"><div class="label">💎 净资产</div><div class="value">¥${fmt(netWorth)}</div><div style="font-size:11px;opacity:.8;margin-top:4px">${netWorth>=0?'资产健康':'资不抵债'}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card positive"><div class="label">本月收入</div><div class="value">¥${fmt(income)}</div><div class="icon">📈</div></div>
      <div class="stat-card negative"><div class="label">本月支出</div><div class="value">¥${fmt(expense)}</div><div class="icon">📉</div></div>

    cardHTML=`<div class="card-list">${items.map(d=>`<div class="rec-card"><div class="rec-main"><div class="rec-name">${esc(d.name)}</div><div class="rec-amount" style="color:var(--danger)">-¥${fmt(d.amount)}</div></div><div class="rec-row"><span class="rec-label">类型</span><span class="rec-val"><span class="badge badge-debt">${esc(d.type||'其他')}</span></span></div>${d.note?`<div class="rec-row"><span class="rec-label">备注</span><span class="rec-val">${esc(d.note)}</span></div>`:''}<div class="rec-row"><span class="rec-label"></span><span class="rec-val"><span class="task-edit" onclick="editDebt('${d.id}')" style="cursor:pointer;font-size:13px;color:var(--primary);margin-right:12px">编辑</span><span class="task-del" onclick="delItem('debts','${d.id}')">删除</span></span></div></div>`).join('')}</div>`;
  }
  if(type==='record'){
    tableHTML=`<div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th></th></tr></thead><tbody>${items.map(r=>`<tr><td>${r.date||'-'}</td><td><span class="badge ${r.type==='income'?'badge-income':'badge-expense'}">${r.type==='income'?'收入':'支出'}</span></td><td>${esc(r.category||'-')}</td><td style="font-weight:600;color:${r.type==='income'?'var(--success)':'var(--danger)'}">${r.type==='income'?'+':'-'}¥${fmt(r.amount)}</td><td style="color:var(--text-muted)">${esc(r.note||'-')}</td><td style="white-space:nowrap"><span class="task-edit" onclick="editRecord('${r.id}')" style="cursor:pointer;font-size:13px;color:var(--primary);margin-right:8px">编辑</span><span class="task-del" onclick="delItem('records','${r.id}')" style="cursor:pointer;font-size:13px">删除</span></td></tr>`).join('')}</tbody></table></div>`;
    cardHTML=`<div class="card-list">${items.map(r=>`<div class="rec-card"><div class="rec-main"><div><div class="rec-name">${esc(r.category||'未分类')}</div><div class="rec-label">${r.date||'-'}</div></div><div class="rec-amount" style="color:${r.type==='income'?'var(--success)':'var(--danger)'}">${r.type==='income'?'+':'-'}¥${fmt(r.amount)}</div></div><div class="rec-row"><span class="rec-label">类型</span><span class="rec-val"><span class="badge ${r.type==='income'?'badge-income':'badge-expense'}">${r.type==='income'?'收入':'支出'}</span></span></div>${r.note?`<div class="rec-row"><span class="rec-label">备注</span><span class="rec-val">${esc(r.note)}</span></div>`:''}<div class="rec-row"><span class="rec-label"></span><span class="rec-val"><span class="task-edit" onclick="editRecord('${r.id}')" style="cursor:pointer;font-size:13px;color:var(--primary);margin-right:12px">编辑</span><span class="task-del" onclick="delItem('records','${r.id}')">删除</span></span></div></div>`).join('')}</div>`;
  }
  return tableHTML+cardHTML;
}

// ============ 待办（工作/生活） ============
const LIFE_CATS = ['家务','购物','健康','社交','学习','其他'];
const WORK_CATS = ['选题','拍摄','剪辑','发布','运营','其他'];

function isLifeTodo(t){
  return LIFE_CATS.includes(t.category);
}

function renderTodos(type){
  const allTodos = DB.get('todos');
  const todos = type==='life' ? allTodos.filter(isLifeTodo) : allTodos.filter(t=>!isLifeTodo(t));
  const filter = currentTodoFilter;
  const title = type==='life' ? '生活待办' : '工作待办';
  const cats = type==='life' ? LIFE_CATS : WORK_CATS;
  document.getElementById('pageActions').innerHTML = `<button class="btn btn-primary btn-sm" onclick="openTodoModal('${type}')">+ ${title}</button>`;
  const today = new Date().toISOString().slice(0,10);
  const overdue=[],todayItems=[],upcoming=[],done=[],noDate=[];
  todos.forEach(t=>{if(t.done){done.push(t);return;}if(!t.date){noDate.push(t);return;}if(t.date<today)overdue.push(t);else if(t.date===today)todayItems.push(t);else upcoming.push(t);});
  let groups=[];
  if(filter!=='done'){if(overdue.length)groups.push({title:'⚠️ 已逾期',items:overdue});if(todayItems.length)groups.push({title:'📅 今日',items:todayItems});if(upcoming.length)groups.push({title:'📆 即将到来',items:upcoming});if(noDate.length)groups.push({title:'📌 未排期',items:noDate});}
  if(filter==='done'||done.length)groups.push({title:'✅ 已完成',items:done});
  
  document.getElementById('content').innerHTML = `
    <div class="tabs">
      <div class="tab ${filter==='all'?'active':''}" onclick="setTodoFilter('all')">全部 (${todos.length})</div>
      <div class="tab ${filter==='todo'?'active':''}" onclick="setTodoFilter('todo')">待办 (${todos.length-done.length})</div>
      <div class="tab ${filter==='done'?'active':''}" onclick="setTodoFilter('done')">已完成 (${done.length})</div>
    </div>
    ${groups.map(g=>`<div class="todo-group"><div class="todo-group-title"><span>${g.title}</span><span class="todo-count">${g.items.length}</span></div><div class="task-list">${g.items.map(t=>`<div class="task-item ${t.done?'done':''}"><div class="task-checkbox ${t.done?'checked':''}" onclick="toggleTodo('${t.id}')"></div><div class="task-content" onclick="editTodo('${t.id}','${type}')" style="cursor:pointer"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${t.date?`📅 ${t.date}`:''}${t.priority?` · <span class="priority-${t.priority}">${{high:'紧急',mid:'重要',low:'常规'}[t.priority]}</span>`:''}${t.category?` · <span class="task-tag">${esc(t.category)}</span>`:''}</div></div><span class="task-edit" onclick="editTodo('${t.id}','${type}')" style="cursor:pointer;margin-right:6px;font-size:13px;color:var(--primary)">编辑</span><span class="task-del" onclick="delTodo('${t.id}')" style="cursor:pointer;font-size:13px">删除</span></div>`).join('')}</div></div>`).join('')}
    ${todos.length===0?`<div class="card"><div class="empty"><div class="emoji">✅</div>暂无${title}，点击右上角添加</div></div>`:''}
  `;
}
function setTodoFilter(f){currentTodoFilter=f;renderContent();}
function openTodoModal(type){
  const cats = type==='life' ? LIFE_CATS : WORK_CATS;
  const defaultCat = type==='life' ? '家务' : '选题';
  const placeholder = type==='life' ? '例如：买日用品' : '例如：剪辑口播视频';
  modalForm(type==='life'?'添加生活待办':'添加工作待办',[
    {key:'title',label:'待办内容',placeholder:placeholder,required:true},
    {key:'date',label:'计划日期',type:'date',value:new Date().toISOString().slice(0,10)},
    {key:'priority',label:'优先级',type:'select',options:[['low','常规'],['mid','重要'],['high','紧急']],value:'mid'},
    {key:'category',label:'分类',type:'select',options:cats,value:defaultCat},
  ],(data)=>{const item={id:uid(),...data,done:false,created:Date.now()};DB.insert('todos',item).then(ok=>{ if(ok){ toast('待办已添加 ✓'); renderContent();renderSidebar();renderBottomNav(); } });});
}
function toggleTodo(id){const todos=DB.get('todos');const t=todos.find(x=>x.id===id);if(t){t.done=!t.done;DB.update('todos',id,{done:t.done}).then(ok=>{ if(ok){ renderContent(); renderSidebar();renderBottomNav(); } });}}
function delTodo(id){if(!confirm('确认删除此待办？'))return;DB.remove('todos',id).then(ok=>{ if(ok){ renderContent();renderSidebar();renderBottomNav(); } });}
function editTodo(id,type){
  const t=DB.get('todos').find(x=>x.id===id);if(!t)return;
  const cats = type==='life' ? LIFE_CATS : WORK_CATS;
  modalForm(type==='life'?'编辑生活待办':'编辑工作待办',[
    {key:'title',label:'待办内容',placeholder:'例如：剪辑口播视频',required:true,value:t.title},
    {key:'date',label:'计划日期',type:'date',value:t.date||''},
    {key:'priority',label:'优先级',type:'select',options:[['low','常规'],['mid','重要'],['high','紧急']],value:t.priority||'mid'},
    {key:'category',label:'分类',type:'select',options:cats,value:t.category||cats[0]},
  ],(data)=>{DB.update('todos',id,data).then(ok=>{ if(ok){ toast('已更新 ✓'); renderContent();renderSidebar();renderBottomNav(); } });});
}

// ============ 作息打卡（复用todos表存储） ============
function renderSleep(){
  document.getElementById('pageActions').innerHTML = '';
  // 从todos里筛选出category为'作息打卡'的记录
  const logs = DB.get('todos').filter(t=>t.category==='作息打卡');
  const today = new Date().toISOString().slice(0,10);
  const todayLog = logs.find(l=>l.date===today);
  const todayWake = todayLog && todayLog.title.includes('起床') ? todayLog.title.split(' ')[1] : '';
  const todaySleep = todayLog && todayLog.title.includes('睡觉') ? todayLog.title.split(' ')[1] : '';
  // 也可能是两条记录
  const todayWakeLog = logs.find(l=>l.date===today && l.title.startsWith('起床'));
  const todaySleepLog = logs.find(l=>l.date===today && l.title.startsWith('睡觉'));
  const wakeTime = todayWakeLog ? todayWakeLog.title.replace('起床 ','') : (todayWake||'');
  const sleepTime = todaySleepLog ? todaySleepLog.title.replace('睡觉 ','') : (todaySleep||'');
  
  // 最近7天
  const last7 = [];
  for(let i=0;i<7;i++){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const wLog = logs.find(l=>l.date===d && l.title.startsWith('起床'));
    const sLog = logs.find(l=>l.date===d && l.title.startsWith('睡觉'));
    last7.push({date:d, wake:wLog?wLog.title.replace('起床 ',''):'', sleep:sLog?sLog.title.replace('睡觉 ',''):''});
  }
  
  const wakeTimes = logs.filter(l=>l.title.startsWith('起床')).map(l=>l.title.replace('起床 ','')).filter(Boolean);
  const sleepTimes = logs.filter(l=>l.title.startsWith('睡觉')).map(l=>l.title.replace('睡觉 ','')).filter(Boolean);
  const totalDays = new Set(logs.map(l=>l.date)).size;
  
  document.getElementById('content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card positive">
        <div class="label">今日起床</div>
        <div class="value" style="font-size:22px">${wakeTime||'未打卡'}</div>
        <div class="sub">${wakeTime?'✅ 已打卡':'点击下方打卡'}</div>
        <div class="icon">🌅</div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff">
        <div class="label" style="color:rgba(255,255,255,0.8)">今日睡觉</div>
        <div class="value" style="font-size:22px;color:#fff">${sleepTime||'未打卡'}</div>
        <div class="sub" style="color:rgba(255,255,255,0.8)">${sleepTime?'✅ 已打卡':'点击下方打卡'}</div>
        <div class="icon">🌙</div>
      </div>
      <div class="stat-card">
        <div class="label">已打卡天数</div>
        <div class="value">${totalDays}</div>
        <div class="sub">累计记录</div>
        <div class="icon">📊</div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title"><span class="left"><span class="dot" style="background:var(--primary)"></span>今日打卡</span></div>
      <div style="display:flex;gap:12px">
        <button class="btn btn-primary" style="flex:1;font-size:16px;padding:16px" onclick="sleepCheckin('wake')">
          ${wakeTime?'🔄 更新起床':'🌅 起床打卡'}
        </button>
        <button class="btn" style="flex:1;font-size:16px;padding:16px;background:#6366f1;color:#fff" onclick="sleepCheckin('sleep')">
          ${sleepTime?'🔄 更新睡觉':'🌙 睡觉打卡'}
        </button>
      </div>
      ${wakeTime||sleepTime?`<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--text-muted)">
        今日起床：${wakeTime||'—'} ｜ 今日睡觉：${sleepTime||'—'}
      </div>`:''}
    </div>

    <div class="card">
      <div class="card-title"><span class="left"><span class="dot" style="background:var(--warning)"></span>最近7天作息</span></div>
      <div class="card-list">
        ${last7.map(d=>`
          <div class="rec-card">
            <div class="rec-main">
              <div>
                <div class="rec-name">${d.date===today?'今天':d.date.slice(5)}</div>
                <div class="rec-label">${['周日','周一','周二','周三','周四','周五','周六'][new Date(d.date).getDay()]}</div>
              </div>
              <div style="text-align:right;font-size:13px">
                ${d.wake?`<span style="color:var(--success)">🌅 ${d.wake}</span>`:'<span style="color:var(--text-muted)">—</span>'}
                ${d.sleep?`<br><span style="color:#8b5cf6">🌙 ${d.sleep}</span>`:''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    ${wakeTimes.length>0||sleepTimes.length>0?`<div class="card">
      <div class="card-title"><span class="left"><span class="dot" style="background:var(--success)"></span>作息统计</span></div>
      <div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat-card" style="padding:14px"><div class="label" style="font-size:12px">平均起床</div><div class="value" style="font-size:20px">${avgTime(wakeTimes)}</div></div>
        <div class="stat-card" style="padding:14px"><div class="label" style="font-size:12px">平均睡觉</div><div class="value" style="font-size:20px;color:#8b5cf6">${avgTime(sleepTimes)}</div></div>
      </div>
    </div>`:''}
  `;
}

function avgTime(times){
  if(!times.length) return '—';
  const mins = times.map(t=>{
    const p = t.split(':');
    return parseInt(p[0])*60+parseInt(p[1]);
  });
  const avg = Math.round(mins.reduce((a,b)=>a+b,0)/mins.length);
  const h = Math.floor(avg/60), m = avg%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function sleepCheckin(type){
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const today = new Date().toISOString().slice(0,10);
  const logs = DB.get('todos').filter(t=>t.category==='作息打卡');
  const prefix = type==='wake'?'起床':'睡觉';
  const existing = logs.find(l=>l.date===today && l.title.startsWith(prefix));
  
  if(existing){
    DB.update('todos', existing.id, {title: prefix+' '+time}).then(ok=>{
      if(ok){ toast(type==='wake'?'起床打卡成功 ✓':'睡觉打卡成功 ✓'); renderContent(); }
    });
  } else {
    const item = {
      id: uid(),
      title: prefix+' '+time,
      date: today,
      priority: 'low',
      category: '作息打卡',
      done: false,
      created: Date.now()
    };
    DB.insert('todos', item).then(ok=>{
      if(ok){ toast(type==='wake'?'起床打卡成功 ✓':'睡觉打卡成功 ✓'); renderContent(); }
    });
  }
}

// ============ 通用模态 ============
function modalForm(title, fields, onSave){
  const m=document.createElement('div');
  m.className='modal-overlay';
  m.innerHTML=`<div class="modal"><h3>${title}</h3>${fields.map(f=>`<div class="form-row"><div style="flex:1;min-width:0"><label class="form-label">${f.label}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>${f.type==='select'?`<select class="select" id="f_${f.key}">${f.options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${v}" ${f.value===v?'selected':''}>${l}</option>`}).join('')}</select>`:f.type==='date'?`<input class="input" type="date" id="f_${f.key}" value="${f.value||''}">`:f.type==='number'?`<input class="input" type="number" id="f_${f.key}" value="${f.value||''}" placeholder="${f.placeholder||''}" min="0" step="0.01">`:f.type==='textarea'?`<textarea class="input" id="f_${f.key}" placeholder="${f.placeholder||''}" style="min-height:120px;resize:vertical;line-height:1.6">${esc(f.value||'')}</textarea>`:`<input class="input" type="text" id="f_${f.key}" value="${f.value||''}" placeholder="${f.placeholder||''}">`}</div></div>`).join('')}<div class="modal-actions"><button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary" id="mSave">保存</button></div></div>`;
  document.body.appendChild(m);
  const fi=m.querySelector('input,select');if(fi)setTimeout(()=>fi.focus(),100);
  m.querySelector('#mSave').onclick=()=>{const data={};for(const f of fields){const el=m.querySelector('#f_'+f.key);data[f.key]=el.value.trim();if(f.required&&!data[f.key])return toast('请填写'+f.label);}m.remove();onSave(data);};
  m.addEventListener('keydown',e=>{if(e.key==='Escape')m.remove();if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='SELECT'){e.preventDefault();m.querySelector('#mSave').click();}});
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});
}

    DB.sync('records'),
    DB.sync('scripts'),

function buildAIContext(){
  let ctx = '';
  const tasks = DB.get('tasks');
  const scripts = DB.get('scripts');
  const stats = DB.get('stats');
  const records = DB.get('records');

  ACCOUNTS.forEach(a=>{

    ctx += `\n【${a.name}】(${a.desc})\n`;
    ctx += `  任务: ${accTasks.length}条 (完成${accTasks.filter(t=>t.done).length}条)\n`;
    ctx += `  选题: ${accScripts.length}个 (已写脚本${accScripts.filter(s=>s.script).length}个)\n`;

      });
    }
  });

  const income = records.filter(r=>r.type==='income').reduce((s,r)=>s+(+r.amount||0),0);

  ctx += `\n本月收入: ¥${income}，支出: ¥${expense}\n`;
  return ctx;
}
